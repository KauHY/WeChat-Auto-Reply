[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-rule-assistant"
version = "0.1.0"
description = "Safety-first local rule assistant with an offline WeChat workflow simulator"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wechat-rule-assistant = "wechat_rule_assistant.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
